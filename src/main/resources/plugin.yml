name: MineshaftRpg
version: '1.0-SNAPSHOT'
main: com.mineshaft.mineshaftRpg.MineshaftRpg
api-version: '1.20'
prefix: MineshaftRpg
authors: [ SebastianFrynas ]
depend: [ MineshaftApi ]
softdepend: [PlaceholderAPI]
description: A port of the RPG features, along with new features from "Another Rpg Plugin"
website: https://github.com/SF-24
commands:
  mineshaft_rpg:
    aliases: [mineshaftrpg]
    description: A command to reload data
  menu:
    description: Opens the character menu
    permission: mineshaft.rpg.menu
  experience:
    aliases: [ exp, exper ]
    description: Used to give the player experience points
    permission: mineshaft.rpg.exp
  character_creation:
    aliases: [charc, char_c, char_creation, charcreation, makecharacter, make_character]
    description: Used for creating a character and debugging character creation.
    permission: mineshaft.rpg.character.make
  ability:
    aliases: [cast]
    description: Player cast command
  ability_admin:
    aliases: [abilityadmin, cast_admin, castadmin, admincast, admin_cast, adminability, admin_ability]
    description: Debug command for abilities
    permission: mineshaft.rpg.admin_ability
permissions:
  mineshaft.rpg.admin_ability:
    default: op
    description: Used for debugging abilities
  mineshaft.rpg.exp:
    default: op
    description: Used to grant players experience points. Exists for debugging purposes.
  mineshaft.rpg.menu:
    default: true
    description: Required to open the character menu
  mineshaft.rpg.character.make:
    default: true
    description: Required to make a character. Remotely executed by the character creation book menu.
  mineshaft.rpg.reload:
    default: op
    description : Required to reload the plugin